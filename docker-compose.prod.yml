services:
  oracle:
    image: europe-west9-docker.pkg.dev/qubic-485810/${WORKSPACE}/oracle:latest
    env_file:
      - .env.prod
    volumes:
      - oracle-sqlite:/data
      - /opt/oracle/keys:/opt/oracle/keys:ro
    ports:
      - "3000:3000"
    restart: unless-stopped

volumes:
  oracle-sqlite:
